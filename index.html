<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Linh Nguyen · Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="intro">
    <div id="game-view">
      <div id="game"></div>

      <p id="hint">Use the arrow keys / WASD to walk up to the objects</p>

      <section id="panel" role="dialog" aria-live="polite" hidden>
        <button id="panel-close" type="button" aria-label="Close">×</button>
        <h2 id="panel-title"></h2>
        <div id="panel-body"></div>
      </section>

      <div id="dpad" aria-hidden="true">
        <button data-dir="up" type="button">▲</button>
        <button data-dir="left" type="button">◀</button>
        <button data-dir="right" type="button">▶</button>
        <button data-dir="down" type="button">▼</button>
      </div>
    </div>

    <main id="classic" hidden></main>

    <!-- Game | Portfolio switch: fixed, same place on both screens -->
    <div id="mode-switch" role="group" aria-label="View mode" data-mode="game">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" data-mode="game" aria-pressed="true"><span aria-hidden="true">🎮</span> Game</button>
      <button type="button" data-mode="classic" aria-pressed="false"><span aria-hidden="true">📄</span> Portfolio</button>
    </div>
    <div id="transition" hidden aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
